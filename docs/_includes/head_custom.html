<style>
  /* --- 1. L'AMBIANCE GÉNÉRALE (Mode Sombre) --- */
  html, body, .main, .main-header, .main-content, .main-content-wrap, .site-header {
    background-color: #0f172a !important; 
    color: #e2e8f0 !important; 
  }

  /* --- 2. LE MENU (Transformé en Top Bar) --- */
  .side-bar {
    background-color: #020617 !important; 
    border-bottom: 1px solid #1e293b; /* La ligne de séparation passe en bas */
    border-right: none !important; /* On retire l'ancienne ligne verticale */
    width: 100% !important;
    max-width: 100% !important;
    height: auto !important;
    display: flex;
    align-items: center;
    justify-content: space-between; /* Sépare le titre à gauche et le menu à droite */
    padding: 10px 30px;
    position: relative; 
    z-index: 1000; /* Garde le menu au-dessus du reste */
  }

  /* --- 3. LES ACCENTS (Titre) --- */
  .site-title {
    color: #38bdf8 !important; 
    font-weight: bold;
    text-transform: uppercase; 
    letter-spacing: 1px; 
    margin: 0;
  }

  /* --- 4. NAVIGATION HORIZONTALE (Boutons du haut) --- */
  /* Le menu principal devient une ligne */
  .nav-list {
    display: flex;
    flex-direction: row;
    margin: 0;
    padding: 0;
    align-items: center;
  }

  .nav-list-item {
    position: relative; /* Indispensable pour que le sous-menu s'attache à ce bouton */
    list-style: none;
    margin: 0 5px;
  }

  /* Liens de premier niveau */
  .nav-list-item > .nav-list-link {
    color: #94a3b8 !important; 
    padding: 10px 15px !important;
    display: block;
    text-decoration: none;
    transition: all 0.2s ease;
    border-left: none !important; /* Reset de l'ancien style */
  }

  /* Survol des boutons du haut : Animation de la bordure en BAS */
  .nav-list-item > .nav-list-link:hover,
  .nav-list-item > .nav-list-link.active {
    color: #38bdf8 !important;
    border-bottom: 2px solid #38bdf8; 
    background: transparent !important;
  }

  /* --- 5. SOUS-CATÉGORIES (Dropdown) --- */
  /* On cache les sous-menus par défaut */
  .nav-list-item .nav-list {
    display: none;
    position: absolute;
    top: 100%; /* Place le sous-menu juste sous le bouton */
    left: 0;
    background-color: #020617 !important;
    min-width: 220px;
    flex-direction: column; /* Les sous-menus redeviennent verticaux */
    border: 1px solid #1e293b;
    border-top: 2px solid #38bdf8; /* Petite ligne cyan pour lier le bouton au menu */
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    padding: 10px 0;
    z-index: 1001;
  }

  /* Affichage du sous-menu au survol de la souris */
  .nav-list-item:hover > .nav-list {
    display: flex;
  }

  /* Style des liens à l'intérieur du sous-menu */
  .nav-list-item .nav-list .nav-list-item {
    width: 100%;
    margin: 0;
  }

  .nav-list-item .nav-list .nav-list-link {
    padding: 10px 20px !important;
    border-bottom: none !important; 
  }

  /* Survol dans les sous-menus : On garde ton animation avec la barre à GAUCHE */
  .nav-list-item .nav-list .nav-list-link:hover,
  .nav-list-item .nav-list .nav-list-link.active {
    color: #38bdf8 !important;
    border-left: 2px solid #38bdf8 !important;
    padding-left: 25px !important; /* Le décalage visuel */
    background-color: #0f172a !important; /* Fond un peu plus clair pour contraster */
  }

  /* --- 6. TYPOGRAPHIE, CONTENU & RESET LAYOUT --- */
  h1, h2, h3, h4, h5, h6 {
    color: #f8fafc !important;
  }
  
  .main-content a {
    color: #38bdf8 !important;
    text-decoration: underline;
  }

  .search, .search-input { display: none !important; }
  .main-header, .site-header { border-bottom: none !important; }
  
  code {
    background-color: #1e293b !important; 
    color: #38bdf8 !important;
  }

  /* Sécurité : Si le thème utilisait une grille verticale, on force le contenu principal 
     à se placer correctement SOUS la nouvelle barre du haut */
  .document, #app, .page-wrap {
    display: flex !important;
    flex-direction: column !important;
  }
  
  .main {
    margin-left: 0 !important; /* Retire l'espace laissé vide par l'ancienne barre latérale */
    width: 100% !important;
  }
</style>
